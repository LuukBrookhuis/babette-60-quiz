<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Babette 60 • The Winner Takes It All</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#101028}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#4d236e 0,transparent 40%),radial-gradient(circle at 90% 85%,#184b7c 0,transparent 38%),#101028}.wrap{max-width:1100px;margin:auto;padding:26px 20px 55px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:clamp(24px,4vw,43px);font-weight:900;letter-spacing:-1px}.gold{color:#ffd77b}.subtitle{color:#c8c5dd}.panel{background:#ffffff12;border:1px solid #ffffff28;border-radius:23px;padding:clamp(20px,3vw,34px);margin:20px 0;box-shadow:0 16px 50px #0002}h1{font-size:clamp(32px,5vw,64px);line-height:1.1;margin:15px 0}h2{margin:0 0 15px;font-size:clamp(24px,3vw,34px)}h3{margin:0 0 12px}p{line-height:1.5}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:15px 22px;font-weight:800;background:#ffcb65;color:#21143c;transition:transform .15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:not-allowed}button.alt{background:#ffffff23;color:#fff;border:1px solid #ffffff55}button.danger{background:#e17b83;color:#fff}input{padding:16px;border-radius:12px;border:1px solid #a7a0c8;background:#fff;color:#15112d;width:100%;max-width:400px}label{display:block;margin:13px 0 7px;font-weight:700}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.choice{display:flex;align-items:center;gap:14px;text-align:left;min-height:90px;padding:18px;border-radius:16px;background:#ffffff14;color:#fff;border:2px solid #ffffff2b;font-size:clamp(16px,2.1vw,24px);width:100%}.choice .letter{background:#fff;color:#1a1740;width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;border-radius:10px;font-weight:900}.choice.selected{border-color:#ffd56e;background:#bd893e55}.choice.correct{border-color:#58e6a4;background:#167d57a8}.choice.wrong{opacity:.55}.choice:disabled{transform:none}.pill{display:inline-block;padding:8px 14px;border-radius:30px;background:#ffffff26;font-weight:700}.muted{color:#c6c2db}.bigpin{font-size:clamp(46px,8vw,96px);font-weight:900;letter-spacing:7px;color:#ffd77b;margin:8px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.stat{background:#ffffff16;border-radius:12px;padding:10px 15px}.board{width:100%;border-collapse:collapse}.board td,.board th{text-align:left;padding:12px;border-bottom:1px solid #ffffff2a}.board td:last-child,.board th:last-child{text-align:right}.rank{color:#ffd77b;font-weight:900}.success{color:#76efb6}.error{color:#ff929e}.center{text-align:center}.small{font-size:14px}.hostcontrols{border:2px dashed #ffcb65;padding:18px;border-radius:18px;margin-top:25px}.hostcontrols h3{color:#ffd77b}.winner{font-size:clamp(30px,6vw,70px);color:#ffd77b;font-weight:900}.roundtag{color:#ffd77b;text-transform:uppercase;letter-spacing:2px;font-size:14px;font-weight:900}.hidden{display:none!important}@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.choice{min-height:70px}.brand{font-size:27px}}

/* ABBA 1970s disco edition */
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background:repeating-linear-gradient(120deg,transparent 0 52px,#ffffff07 53px 54px),radial-gradient(circle at 50% -8%,#f3ca6c44,transparent 48%)}
.brand{font-family:Georgia,serif;font-weight:900;letter-spacing:.075em;text-shadow:0 2px 0 #8e4d83,0 4px 16px #ffcf77a8}
.gold{background:linear-gradient(120deg,#fff6d7,#ffca59,#fff4bd);background-clip:text;-webkit-background-clip:text;color:transparent}
.panel{backdrop-filter:blur(9px);background:linear-gradient(135deg,#ffffff17,#ffffff07);border:1px solid #ffe4aa45}
.roundtag{display:inline-block;border-bottom:2px solid #e8b860;padding-bottom:9px}
.choice{transition:transform .16s,border-color .16s,background .16s}
.choice:not(:disabled):hover{transform:translateY(-3px);border-color:#ffd77b}
.choice .letter{background:linear-gradient(145deg,#fff6dc,#f3b84b);box-shadow:0 3px 0 #ac7b2f}
button:not(.choice){box-shadow:0 5px 0 #a87433}
button.alt{box-shadow:0 5px 0 #453d67}
button:disabled{box-shadow:none}
.bigpin{text-shadow:0 0 28px #ffc96165}
.winner{text-shadow:0 0 35px #e8ba72}
@media(prefers-reduced-motion:no-preference){.brand{animation:shine 5s ease-in-out infinite}@keyframes shine{50%{filter:brightness(1.28)}}}
</style></head><body><div class="wrap"><header><div><div class="brand">✨ <span class="gold">BABETTE 60</span> ✨</div><div class="subtitle">The Winner Takes It All · De ultieme ABBA-quiz</div></div><span id="status" class="pill">🎉 Feesteditie</span></header><main id="app"></main><footer class="center muted small">26 vragen · 5 ABBA-rondes · Babette beslist · 1 punt per goed antwoord</footer></div><script>
const app=document.getElementById('app'),statusEl=document.getElementById('status');let pin='',token='',teamId='',mode='',state=null,stream=null,selection=null,lastIndex=-1;const letters=['A','B','C','D'];
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(route,data){const res=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const obj=await res.json();if(!res.ok)throw Error(obj.error||'Er ging iets mis');return obj;}
function notice(msg){alert(msg)}async function action(route,extra={}){try{await api(route,{pin,token,...extra});}catch(e){notice(e.message)}}
function home(){mode='';pin='';state=null;if(stream)stream.close();statusEl.textContent='🎉 Feesteditie';app.innerHTML=`<section class="panel center"><p class="roundtag">60 jaar · ABBA · familie · feest</p><h1>Hoe goed ken jij <span class="gold">Babette?</span></h1><p>Speel samen per stel. Babette bepaalt na elke stemming het juiste antwoord. De punten verschijnen direct live!</p><div class="actions" style="justify-content:center"><button onclick="create()">🎤 Ik ben de quizmaster</button><button class="alt" onclick="joinForm()">📱 Wij spelen mee</button></div></section><section class="panel"><h3>Hoe werkt het?</h3><p>Open deze website op de televisie als quizmaster. De stellen openen dezelfde link op hun telefoon, voeren de zes-cijferige code in en kiezen hun teamnaam. De quizmaster bedient de vragen op de televisie.</p></section>`}
async function create(){try{const r=await api('create',{});pin=r.pin;token=r.token;mode='host';history.replaceState(null,'','/?host='+pin+'#'+token);connect()}catch(e){notice(e.message)}}
function joinForm(){mode='join';app.innerHTML=`<section class="panel"><h2>📱 Speel mee als stel</h2><label for="pin">Quizcode op de televisie</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="Bijvoorbeeld 123456"><label for="name">Jullie teamnaam</label><input id="name" maxlength="35" placeholder="Bijvoorbeeld Team Ronald"><div class="actions"><button onclick="join()">Doe mee →</button><button class="alt" onclick="home()">Terug</button></div></section>`}
async function join(){try{pin=document.getElementById('pin').value.trim();const name=document.getElementById('name').value.trim();const r=await api('join',{pin,name});teamId=r.id;mode='player';sessionStorage.setItem('babetteTeam',JSON.stringify({pin,id:teamId}));history.replaceState(null,'','/?join='+pin);connect()}catch(e){notice(e.message)}}
function connect(){if(stream)stream.close();stream=new EventSource('/api/events?pin='+encodeURIComponent(pin));stream.onmessage=e=>{state=JSON.parse(e.data);if(state.index!==lastIndex){selection=null;lastIndex=state.index}render()};stream.onerror=()=>{statusEl.textContent='🔄 Verbinding herstellen…'};}
function team(){return state?.teams.find(t=>t.id===teamId)}
function sorted(){return [...state.teams].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name))}
function scoreboard(){const rows=sorted().map((t,i)=>`<tr><td><span class="rank">${i+1}.</span> ${safe(t.name)}</td><td><b>${t.score}</b> ${t.score===1?'punt':'punten'}</td></tr>`).join('');return `<section class="panel"><h2>🏆 Tussenstand</h2><table class="board"><thead><tr><th>Stel</th><th>Punten</th></tr></thead><tbody>${rows||'<tr><td colspan="2">Nog geen teams</td></tr>'}</tbody></table></section>`}
function choices(){const q=state.question;return `<div class="grid">${q.options.map((o,i)=>{const picked=mode==='player'?(team()?.answer??selection)===i:false;const revealed=state.phase==='revealed';const css=revealed?(i===state.correct?'correct':'wrong'):(picked?'selected':'');return `<button class="choice ${css}" ${mode!=='player'||state.phase!=='voting'?'disabled':''} onclick="vote(${i})"><span class="letter">${letters[i]}</span><span>${safe(o)}</span>${revealed&&i===state.correct?' <span>✓</span>':''}</button>`}).join('')}</div>`}
async function vote(i){try{await api('answer',{pin,id:teamId,answer:i});selection=i}catch(e){notice(e.message)}}
function hostControls(){if(mode!=='host')return '';let btn='';if(state.phase==='lobby')btn=`<button onclick="action('start')">▶ Start de quiz</button>`;if(state.phase==='voting')btn=`<button onclick="action('close')">🔒 Sluit de stemming</button><button class="alt" onclick="revealPrompt()">👑 Babette kiest nu</button>`;if(state.phase==='closed')btn=`<button onclick="revealPrompt()">👑 Kies Babettes antwoord</button>`;if(state.phase==='revealed')btn=`<button onclick="action('next')">${state.index===state.total-1?'🏆 Toon de einduitslag':'Volgende vraag →'}</button>`;return `<div class="hostcontrols"><h3>🎤 Quizmasterbediening (alleen op dit scherm)</h3><div class="actions">${btn}<button class="alt" onclick="if(confirm('Hele quiz opnieuw starten en alle scores wissen?'))action('reset')">↺ Opnieuw beginnen</button></div></div>`}
function revealPrompt(){if(!state||!['voting','closed'].includes(state.phase))return;app.querySelector('#revealpanel')?.remove();const div=document.createElement('div');div.id='revealpanel';div.className='panel';div.innerHTML=`<h2>👑 Wat kiest Babette?</h2><p>Laat Babette eerst hardop antwoorden en klik daarna haar keuze aan. De punten worden direct toegekend.</p><div class="grid">${state.question.options.map((o,i)=>`<button class="choice" onclick="confirmReveal(${i})"><span class="letter">${letters[i]}</span>${safe(o)}</button>`).join('')}</div>`;app.querySelector('.hostcontrols').before(div);div.scrollIntoView({behavior:'smooth',block:'center'})}
function confirmReveal(i){if(confirm(`Babette kiest ${letters[i]}: ${state.question.options[i]}?`))action('reveal',{correct:i})}
function render(){if(!state)return;statusEl.textContent=mode==='host'?'🎤 Quizmaster':`📱 ${mode==='player'?'Team':'Quiz'}`;if(state.phase==='lobby'){app.innerHTML=`<section class="panel center"><p class="roundtag">Iedereen klaar?</p><h1>Welkom bij <span class="gold">Babettes quiz!</span></h1><p>De quizcode is</p><div class="bigpin">${safe(pin)}</div><div style="display:flex;justify-content:center;margin:18px 0 12px"><div style="background:white;padding:10px;border-radius:14px;display:inline-flex"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQMAAAEDAQAAAAAZqlxmAAAB40lEQVR4nO2ZTa6bMBSFv4sHZObsgOyE7AxnZ7AT2AHMqGR8OnDylCe9tpPCay08QULf4BzdX4OJ35+p+gMAJ3ESJ3E8sZiZ2YXpTrVdlhuwmZlZdayO/QkkzY2kWM9Aop6hs1hLkkka/xWlf48Ychhbufjj2vQkWMzC4ToOJQYDmO6P6lfEMTqOIPwIW635u3XsSLzVrcZWUM+0KrVukZ7RrOem7yw+HwAU57YCvCRpBdjq5QrgJEnpWB37E58mUPuW0BpBpcU2O2qDaaWRLOJHSG6l6ctzWwE0PTI/wyO5dbm1chFodbSOQ4jlBtLqB1O1Xbx6EjDdj9axP/HqyYq1njYbBUV8qRNIUiBX6ttpFIp0OwN5rQgJ/NjmoNIV2qWk5JYrgyqgeYS0XZa2p7gbXwUw3R9sXuqxWM9TZ7jVD3cK3S56LCe0afVSUIT8sqxMftZtp4gfWyWyzbxZlem2kXArtHn09F1yeZ0s1G1Ir814fS1RpWby88zQJbd6Pau4LTS2ANSSclAVLNYzBc9bRZjMcJqhw600sqN17E58TKBYa3zZDAAl9uQviMmyzSF8r479iTx2bTOzG49Cd6mPb46JfPFz0khXXCZ/+uaoQL4D5WIuryfb+bf6JE7ivyN+AreDrXqdw1ZvAAAAAElFTkSuQmCC" alt="Scan om mee te spelen" width="190" height="190" style="display:block;max-width:45vw;image-rendering:pixelated"></div></div><p><b>Scan de QR-code met je telefoon</b>, kies <b>Wij spelen mee</b> en voer de quizcode hierboven in.</p><div class="stats" style="justify-content:center"><span class="stat">👫 ${state.teams.length} stellen aangemeld</span><span class="stat">🎵 5 rondes</span><span class="stat">❓ 26 vragen</span></div><p>${state.teams.map(t=>safe(t.name)).join(' · ')}</p>${mode==='player'?'<p class="success">✓ Jullie zijn aangemeld. Wacht tot de quizmaster begint.</p>':''}${hostControls()}</section>`;return}
if(state.phase==='finished'){const leaders=sorted(),top=leaders[0]?.score,win=leaders.filter(t=>t.score===top);app.innerHTML=`<section class="panel center"><p class="roundtag">The Winner Takes It All</p><h1>🎉 De grote finale! 🎉</h1><p>De winnaars van Babettes 60e verjaardag zijn…</p><div class="winner">${win.length?win.map(t=>safe(t.name)).join(' & '):'Iedereen!'}</div><h2>${top??0} punten</h2><p>Dank je wel Babette! 💛</p>${hostControls()}</section>${scoreboard()}`;return}
const q=state.question;const count=state.teams.filter(t=>t.answered).length;const my=team();const answered=state.phase==='voting'&&mode==='player'&&my?.answered;const prevRound=state.index>0?state.index&&state.index>0&&state.index<state.total&&state.question.round!==undefined?null:null:null;
app.innerHTML=`<section class="panel"><div class="roundtag">🎵 ${safe(q.round)}</div><div class="stats"><span class="stat">Vraag ${state.index+1} van ${state.total}</span><span class="stat">${count}/${state.teams.length} stellen gestemd</span><span class="stat">${state.phase==='voting'?'🟢 Stemmen open':state.phase==='closed'?'🔒 Stemmen gesloten':'👑 Babette heeft gekozen'}</span></div><h1>${safe(q.text)}</h1>${choices()}${answered?'<p class="success">✓ Jullie antwoord is opgeslagen. Je mag nog wijzigen zolang de stemming open is.</p>':''}${mode==='player'&&state.phase==='closed'?'<p class="muted">Wachten op Babettes antwoord…</p>':''}${state.phase==='revealed'?`<h2 class="center success">👑 Babette kiest ${letters[state.correct]}!</h2>${mode==='player'?`<p class="center">${my?.answer===state.correct?'<b class="success">🎉 Goed geraden! +1 punt</b>':my?.answer===undefined||my?.answer===null?'<b>Jullie hebben niet gestemd.</b>':'<b>Helaas, geen punt deze ronde.</b>'}</p>`:''}<h3>Wie had het goed?</h3><p>${state.teams.filter(t=>t.answer===state.correct).map(t=>safe(t.name)).join(' · ')||'Niemand! Babette heeft iedereen verrast.'}</p>`:''}${hostControls()}</section>${state.phase==='revealed'?scoreboard():''}`;
}
(function boot(){const params=new URLSearchParams(location.search);const h=params.get('host'),t=location.hash.slice(1);if(h&&t){pin=h;token=t;mode='host';connect();return}const saved=JSON.parse(sessionStorage.getItem('babetteTeam')||'null');if(params.get('join')&&saved?.pin===params.get('join')){pin=saved.pin;teamId=saved.id;mode='player';connect();return}home()})();
</script></body></html>
